<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title}</title>
    <script>
        // 主题初始化：优先本地覆盖，否则跟随浏览器深浅模式（尽早执行以避免闪烁）
        (function () {
            try {
                var stored = localStorage.getItem('nd-theme');
                if (stored === 'light' || stored === 'dark') {
                    document.documentElement.setAttribute('data-theme', stored);
                }
            } catch (e) { /* localStorage 不可用时静默跟随系统 */ }
        })();
    </script>
    <style>
        /* 设计令牌 —— 浅色 */
        :root {
            --nd-accent: #10b981;
            --nd-accent-strong: #059669;
            --nd-accent-soft: rgba(16, 185, 129, 0.10);
            --nd-accent-ring: rgba(16, 185, 129, 0.18);
            --nd-page: #eef0f3;
            --nd-surface: #ffffff;
            --nd-panel: #f7f9f8;
            --nd-border: #e5e7eb;
            --nd-border-strong: #d4d7dc;
            --nd-text: #1f2328;
            --nd-text-muted: #6b7280;
            --nd-danger: #b42318;
            --nd-danger-bg: #fef3f2;
            --nd-danger-border: #fdd7d2;
            --nd-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 12px 32px rgba(16, 24, 40, 0.10);
        }

        /* 深色令牌：系统深色（未手动指定浅色时）*/
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --nd-accent: #2dd4a7;
                --nd-accent-strong: #34d399;
                --nd-accent-soft: rgba(45, 212, 167, 0.14);
                --nd-accent-ring: rgba(45, 212, 167, 0.22);
                --nd-page: #0b0d10;
                --nd-surface: #16191f;
                --nd-panel: #1b1f26;
                --nd-border: #2a2f37;
                --nd-border-strong: #363c45;
                --nd-text: #e6e8eb;
                --nd-text-muted: #9199a3;
                --nd-danger: #f9a8a0;
                --nd-danger-bg: rgba(180, 35, 24, 0.12);
                --nd-danger-border: rgba(180, 35, 24, 0.35);
                --nd-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 40px rgba(0, 0, 0, 0.45);
            }
        }

        /* 深色令牌：手动指定深色 */
        :root[data-theme="dark"] {
            --nd-accent: #2dd4a7;
            --nd-accent-strong: #34d399;
            --nd-accent-soft: rgba(45, 212, 167, 0.14);
            --nd-accent-ring: rgba(45, 212, 167, 0.22);
            --nd-page: #0b0d10;
            --nd-surface: #16191f;
            --nd-panel: #1b1f26;
            --nd-border: #2a2f37;
            --nd-border-strong: #363c45;
            --nd-text: #e6e8eb;
            --nd-text-muted: #9199a3;
            --nd-danger: #f9a8a0;
            --nd-danger-bg: rgba(180, 35, 24, 0.12);
            --nd-danger-border: rgba(180, 35, 24, 0.35);
            --nd-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 40px rgba(0, 0, 0, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
            'Helvetica Neue', Arial, sans-serif;
            background-color: var(--nd-page);
            background-image:
                radial-gradient(1200px 600px at 100% -10%, var(--nd-accent-soft), transparent 60%),
                radial-gradient(900px 500px at -10% 110%, var(--nd-accent-soft), transparent 55%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
            color: var(--nd-text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* 主题切换按钮（视口右上角）*/
        .theme-toggle {
            position: fixed;
            top: 1.1rem;
            right: 1.1rem;
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--nd-border);
            border-radius: 10px;
            background: var(--nd-surface);
            color: var(--nd-text-muted);
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
            z-index: 10;
        }

        .theme-toggle:hover {
            color: var(--nd-accent-strong);
            border-color: var(--nd-border-strong);
        }

        .theme-toggle:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--nd-accent-ring);
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
        }

        /* 图标随主题切换：浅色显示「月亮」，深色显示「太阳」 */
        .icon-sun { display: none; }
        .icon-moon { display: block; }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .icon-moon { display: none; }
            :root:not([data-theme="light"]) .icon-sun { display: block; }
        }

        :root[data-theme="dark"] .icon-moon { display: none; }
        :root[data-theme="dark"] .icon-sun { display: block; }
        :root[data-theme="light"] .icon-moon { display: block; }
        :root[data-theme="light"] .icon-sun { display: none; }

        /* 分栏卡片 */
        .login-shell {
            display: flex;
            width: 100%;
            max-width: 840px;
            background: var(--nd-surface);
            border: 1px solid var(--nd-border);
            border-radius: 14px;
            box-shadow: var(--nd-shadow);
            overflow: hidden;
        }

        /* 品牌区（左侧）*/
        .brand-panel {
            flex: 0 0 44%;
            padding: 3rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 1rem;
            background:
                linear-gradient(165deg, var(--nd-accent-soft), transparent 70%),
                var(--nd-panel);
            border-right: 1px solid var(--nd-border);
            position: relative;
        }

        /* 品牌区顶部强调点缀 */
        .brand-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--nd-accent), transparent);
        }

        .logo-container {
            margin-bottom: 0.25rem;
        }

        .logo {
            max-width: 88px;
            max-height: 88px;
            width: auto;
            height: auto;
            display: block;
        }

        /* 仅有 Logo 时的间距微调 */
        .logo-only {
            margin-bottom: 0.5rem;
        }

        .logo-only .logo {
            max-width: 108px;
            max-height: 108px;
        }

        .title {
            font-size: 1.6rem;
            font-weight: 680;
            letter-spacing: -0.015em;
            color: var(--nd-text);
            line-height: 1.25;
        }

        .with-logo .title {
            font-size: 1.45rem;
        }

        /* 表单区（右侧）*/
        .form-panel {
            flex: 1;
            padding: 3rem 2.75rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-heading {
            font-size: 1.1rem;
            font-weight: 640;
            color: var(--nd-text);
            margin-bottom: 0.35rem;
        }

        .subtitle {
            color: var(--nd-text-muted);
            font-size: 0.875rem;
            margin-bottom: 1.75rem;
        }

        /* 注销提示 */
        .logout-info {
            background: var(--nd-accent-soft);
            color: var(--nd-accent-strong);
            margin-bottom: 1.25rem;
            padding: 0.75rem 0.875rem;
            border-radius: 8px;
            border-left: 3px solid var(--nd-accent);
            font-size: 0.85rem;
            display: none;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 550;
            color: var(--nd-text);
            font-size: 0.875rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 0.9rem;
            border: 1px solid var(--nd-border-strong);
            border-radius: 8px;
            font-size: 0.95rem;
            color: var(--nd-text);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            background: var(--nd-surface);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--nd-accent);
            box-shadow: 0 0 0 3px var(--nd-accent-ring);
        }

        .form-group input::placeholder {
            color: var(--nd-text-muted);
            opacity: 0.75;
        }

        .password-wrapper {
            position: relative;
        }

        /* 主按钮 */
        .login-btn {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.8rem 1rem;
            background: var(--nd-accent);
            color: #06231a;
            border: 1px solid var(--nd-accent);
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 640;
            cursor: pointer;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
        }

        .login-btn:hover:not(:disabled) {
            background: var(--nd-accent-strong);
            border-color: var(--nd-accent-strong);
        }

        .login-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--nd-accent-ring);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* 消息提示 */
        .message {
            margin-top: 1rem;
            padding: 0.7rem 0.875rem;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }

        .message.error {
            background: var(--nd-danger-bg);
            color: var(--nd-danger);
            border: 1px solid var(--nd-danger-border);
        }

        .message.success {
            background: var(--nd-accent-soft);
            color: var(--nd-accent-strong);
            border: 1px solid var(--nd-accent-ring);
        }

        /* 加载指示 */
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(6, 35, 26, 0.35);
            border-radius: 50%;
            border-top-color: #06231a;
            animation: spin 0.7s linear infinite;
            margin-right: 0.5rem;
            vertical-align: -2px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式：窄屏堆叠为上下结构 */
        @media (max-width: 640px) {
            .login-shell {
                flex-direction: column;
                max-width: 420px;
            }

            .brand-panel {
                flex: none;
                padding: 2.25rem 1.75rem 1.75rem;
                border-right: none;
                border-bottom: 1px solid var(--nd-border);
            }

            .form-panel {
                padding: 1.75rem;
            }

            .title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
<button type="button" id="themeToggle" class="theme-toggle" aria-label="切换深浅色模式" title="切换深浅色模式">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
    </svg>
</button>

<div class="login-shell">
    <!-- 品牌区：Logo + 标题 -->
    <div class="brand-panel">
        <!-- Logo 区域 - 根据是否有logo动态显示 -->
        <!-- LOGO_PLACEHOLDER_START -->
        <div class="logo-container LOGO_CLASS_PLACEHOLDER">
            <img src="LOGO_SRC_PLACEHOLDER" alt="Logo" class="logo">
        </div>
        <!-- LOGO_PLACEHOLDER_END -->

        <!-- 标题区域 - 根据是否有logo调整样式 -->
        <div class="TITLE_CLASS_PLACEHOLDER">
            <h1 class="title">TITLE_PLACEHOLDER</h1>
        </div>
    </div>

    <!-- 表单区 -->
    <div class="form-panel">
        <h2 class="form-heading">身份验证</h2>
        <p class="subtitle">请输入密码以访问 API 文档</p>

        <!-- 注销提示信息 -->
        <div id="logoutInfo" class="logout-info">
            <strong>安全提示：</strong> 您已安全退出，请重新进行身份认证
        </div>

        <!-- 登录表单 -->
        <form id="loginForm">
            <div class="form-group">
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="请输入访问密码" required
                           autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">
                <span id="btnText">访问文档</span>
            </button>
            <div id="message" class="message"></div>
        </form>
    </div>
</div>

<script>
    // ==================== 主题切换 ====================

    /**
     * 右上角深浅色切换：默认跟随系统，点击后写入 localStorage 覆盖。
     */
    (function () {
        var toggle = document.getElementById('themeToggle');
        if (!toggle) {
            return;
        }

        function systemPrefersDark() {
            return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }

        function currentIsDark() {
            var attr = document.documentElement.getAttribute('data-theme');
            if (attr === 'dark') {
                return true;
            }
            if (attr === 'light') {
                return false;
            }
            return systemPrefersDark();
        }

        toggle.addEventListener('click', function () {
            var next = currentIsDark() ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try {
                localStorage.setItem('nd-theme', next);
            } catch (e) { /* 忽略存储异常 */ }
        });
    })();

    // ==================== 页面初始化 ====================

    /**
     * 页面加载完成后的初始化操作
     */
    document.addEventListener('DOMContentLoaded', function() {
        // 检查是否来自注销操作
        if (window.location.search.includes('action=logout')) {
            document.getElementById('logoutInfo').style.display = 'block';
            // 清理URL中的logout参数，避免刷新时重复显示
            history.replaceState({}, '', window.location.pathname);
        }

        // 自动聚焦到密码输入框
        document.getElementById('password').focus();
    });

    // ==================== 表单提交处理 ====================

    /**
     * 处理登录表单提交
     */
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const password = document.getElementById('password').value.trim();
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const messageEl = document.getElementById('message');

        // 验证输入
        if (!password) {
            showMessage('请输入访问密码', 'error');
            shakeInput();
            return;
        }

        // 设置加载状态
        setLoadingState(true);
        hideMessage();

        // 构造认证信息（用户名为空，只使用密码）
        const credentials = btoa(':' + password);

        // 发送认证请求
        fetch(window.location.href, {
            method: 'GET',
            headers: {
                'Authorization': 'Basic ' + credentials,
                'X-Requested-With': 'XMLHttpRequest',
                'Accept': 'application/json',
                'Cache-Control': 'no-cache'
            }
        })
            .then(response => {
                if (response.ok) {
                    // 认证成功
                    return response.json().then(data => {
                        showMessage('认证成功，正在跳转到文档页面...', 'success');
                        // 延迟跳转，让用户看到成功提示
                        setTimeout(() => {
                            window.location.href = window.location.pathname + '?t=' + Date.now();
                        }, 1200);
                    });
                } else if (response.status === 401) {
                    // 认证失败
                    return response.json().then(data => {
                        showMessage((data.message || '密码错误，请重新输入'), 'error');
                        shakeInput();
                        // 清空密码输入框
                        document.getElementById('password').value = '';
                        document.getElementById('password').focus();
                    }).catch(() => {
                        showMessage('密码错误，请重新输入', 'error');
                        shakeInput();
                        document.getElementById('password').value = '';
                        document.getElementById('password').focus();
                    });
                } else {
                    // 其他HTTP错误
                    showMessage('服务器响应异常，请稍后重试', 'error');
                }
            })
            .catch(error => {
                console.error('认证请求失败:', error);
                showMessage('网络连接异常，请检查网络后重试', 'error');
            })
            .finally(() => {
                // 恢复按钮状态
                setLoadingState(false);
            });
    });

    // ==================== 辅助函数 ====================

    /**
     * 设置按钮加载状态
     * @param {boolean} loading 是否为加载状态
     */
    function setLoadingState(loading) {
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');

        if (loading) {
            loginBtn.disabled = true;
            btnText.innerHTML = '<span class="spinner"></span>认证中...';
        } else {
            loginBtn.disabled = false;
            btnText.innerHTML = '访问文档';
        }
    }

    /**
     * 显示消息提示
     * @param {string} text 消息内容
     * @param {string} type 消息类型：'success' | 'error'
     */
    function showMessage(text, type) {
        const messageEl = document.getElementById('message');
        messageEl.textContent = text;
        messageEl.className = 'message ' + type;
        messageEl.style.display = 'block';

        // 自动隐藏成功消息
        if (type === 'success') {
            setTimeout(() => {
                hideMessage();
            }, 3000);
        }
    }

    /**
     * 隐藏消息提示
     */
    function hideMessage() {
        const messageEl = document.getElementById('message');
        messageEl.style.display = 'none';
    }

    /**
     * 输入框抖动效果
     */
    function shakeInput() {
        const input = document.getElementById('password');
        input.style.animation = 'shake 0.5s ease';
        setTimeout(() => {
            input.style.animation = '';
        }, 500);
    }

    // 添加抖动动画样式
    const style = document.createElement('style');
    style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
                20%, 40%, 60%, 80% { transform: translateX(5px); }
            }
        `;
    document.head.appendChild(style);

    // ==================== 键盘事件处理 ====================

    /**
     * 处理键盘快捷键
     */
    document.addEventListener('keydown', function(e) {
        // Ctrl/Cmd + Enter 提交表单
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }

        // ESC 清空输入和消息
        if (e.key === 'Escape') {
            document.getElementById('password').value = '';
            hideMessage();
            document.getElementById('password').focus();
        }
    });

    // ==================== 页面可见性处理 ====================

    /**
     * 处理页面可见性变化（防止页面长时间后台运行）
     */
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            // 页面重新可见时，聚焦到密码输入框
            document.getElementById('password').focus();
        }
    });
</script>
</body>
</html>
