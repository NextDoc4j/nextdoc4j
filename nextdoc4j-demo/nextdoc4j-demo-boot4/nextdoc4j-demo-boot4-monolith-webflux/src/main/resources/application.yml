server:
  port: 8101

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

nextdoc4j:
  enabled: true
  production: false
  auth:
    enabled: false
  extension:
    enabled: true
    brand:
      title: NextDoc4j WebFlux Demo SB4
