name: ✨ 功能请求
description: 提出新功能、体验改进或兼容性支持建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请尽量说明真实使用场景和要解决的问题，方便评估范围与实现方式。
  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      description: 请选择建议最主要涉及的模块。
      options:
        - 后端 nextdoc4j
        - 前端 nextdoc4j-ui
        - 官网 nextdoc4j-doc
        - 集成示例 nextdoc4j-demo
        - 集中测试 nextdoc4j-tests
        - 发布脚本 release
        - 跨模块
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前有什么限制、痛点或使用障碍？请描述具体场景。
      placeholder: 当前在 ... 场景下，需要 ...，但目前 ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的解决方案
      description: 你希望 NextDoc4j 最终表现为什么样？可以附上示例配置、接口或界面草图。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 你是否尝试过临时解决方案，或考虑过其他实现方式？
  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 该建议是否涉及兼容性、配置变更、前端资源、Maven 制品或文档更新？
  - type: input
    id: related
    attributes:
      label: 相关 Issue 或 PR
      description: 如果有相关讨论，请填写链接或编号。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，确认不是重复建议。
          required: true
